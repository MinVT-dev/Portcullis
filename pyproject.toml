[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "portcullis"
version = "0.0.1"
description = "Discord bot for CubeCoders AMP 3 (successor to Gatekeeper V2/V3)"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
    "pydantic>=2.6,<3",
    "aiosqlite>=0.20,<1",
    "discord.py>=2.5,<3",
    # Status banners (/server banner and the image board). Pillow's licence (HPND) is AGPL-compatible.
    "pillow>=10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    # Pinned so regenerating from the same spec gives the same code.
    "datamodel-code-generator==0.90.0",
    "black==26.10.1",
    "isort==8.0.1",
    "pip-audit>=2.7",
]

# The AMP client lives in packages/portcullis-api so others can use it on its own. Installing this
# project installs it too (one `pip install -e .`), from the same source folder.
[tool.setuptools.packages.find]
where = [".", "packages/portcullis-api/src"]
include = ["portcullis", "portcullis.*", "portcullis_api", "portcullis_api.*"]

[tool.setuptools.package-data]
"portcullis_api" = ["spec/*", "py.typed"]
"portcullis.db" = ["migrations/*.sql"]
"portcullis.assets" = ["games.json", "fallback/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["packages/portcullis-api/src/portcullis_api/models.py", "packages/portcullis-api/src/portcullis_api/api/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["ASYNC109"]  # explicit per-call timeouts are part of the API

[tool.ruff.lint.isort]
known-first-party = ["portcullis", "portcullis_api", "tests", "tools"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC240"]
