[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "portcullis-api"
version = "0.2.0"
description = "Async, typed Python client for the CubeCoders AMP 3 web API (REST and SignalR)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["amp", "cubecoders", "game server", "signalr", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.10,<4",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    # Pinned so regenerating from the same spec gives the same code.
    "datamodel-code-generator==0.90.0",
    "black==26.10.1",
    "isort==8.0.1",
]

[project.urls]
Source = "https://github.com/MinVT-dev/Portcullis/tree/main/packages/portcullis-api"

[tool.setuptools.packages.find]
where = ["src"]
include = ["portcullis_api*"]

[tool.setuptools.package-data]
"portcullis_api" = ["spec/*", "py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/portcullis_api/models.py", "src/portcullis_api/api/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["ASYNC109"]  # explicit per-call timeouts are part of the API

[tool.ruff.lint.isort]
known-first-party = ["portcullis_api", "codegen"]
