name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The runner's Python 3.11 ships an old setuptools that pip-audit flags; it is not a project dependency.
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Dependency audit
        run: pip-audit --skip-editable

  # Stopping with Ctrl+C behaves differently on Windows (no loop signal handlers, the proactor loop),
  # and Windows is where most people run the bot, so the shutdown tests run there too.
  shutdown-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Shutdown tests
        run: pytest -q tests/test_shutdown.py

  # The AMP client on its own, installed without the bot, as a third party would use it.
  api-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: packages/portcullis-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools build
      - name: Build the wheel and sdist
        run: python -m build
      - name: Install the wheel with test tools only (no bot, no discord.py)
        run: |
          pip install dist/*.whl "pytest>=8" "pytest-asyncio>=0.23" "ruff>=0.6" \
            "datamodel-code-generator==0.90.0" "black==26.10.1" "isort==8.0.1"
          python -c "import importlib.util as u; assert u.find_spec('discord') is None and u.find_spec('portcullis') is None"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Generated client matches the pinned spec
        run: python -m codegen.generate_client --check
