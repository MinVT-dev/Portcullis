name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The runner's Python 3.11 ships an old setuptools that pip-audit flags; it is not a project dependency.
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Generated client matches the pinned spec
        run: python -m tools.generate_client --check
      - name: Dependency audit
        run: pip-audit --skip-editable
