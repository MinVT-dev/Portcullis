<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Gatekeeper banner mock-up">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101B33"/><stop offset="1" stop-color="#070C18"/>
    </linearGradient>
    <radialGradient id="b-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="b-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#b-bg)"/>
  <rect width="1280" height="640" fill="url(#b-grid)"/>
  <circle cx="300" cy="320" r="300" fill="url(#b-halo)"/>
  <g transform="translate(110 130) scale(0.74)">
