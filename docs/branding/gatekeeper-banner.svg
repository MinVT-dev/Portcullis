  <rect x="564" y="330" width="96" height="6" rx="3" fill="#2DD4BF"/>
  <text x="560" y="398" font-size="38" fill="#93A6C4" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">Your game servers, in Discord.</text>
