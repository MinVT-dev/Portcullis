    </linearGradient>
    <linearGradient id="b-m-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A5F"/><stop offset="1" stop-color="#122640"/>
    </linearGradient>
    <radialGradient id="b-m-key" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#7CF5E4"/><stop offset="1" stop-color="#14B8A6"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#b-m-bg)"/>
  <path d="M256 72 L412 128 V252 C412 350 344 418 256 448 C168 418 100 350 100 252 V128 Z"
